[project]
name = "mx-labor-law-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Eduardo_Rdgz",email = "phys.eduardo.ra@gmail.com"}
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12, <3.13"
dependencies = [
    "openai (>=3.42.1,<4.0.0)",
    "langfuse (>=5.1.0,<6.0.0)",
    "pypdf (>=6.21.4,<7.0.0)",
    "numpy (>=2.5.4,<3.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)"
]

[tool.poetry]
packages = [{include = "mx_labor_law_assistant", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]
